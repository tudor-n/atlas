# Every change is tested on both OSes before it can reach master (dual-boot design §5.5).
# The update step only fast-forwards a live copy to a master commit whose "test (ubuntu-latest)"
# and "test (windows-latest)" check runs passed (plan decision P9): keep those job names.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: app/uv.lock
      # --locked: a stale uv.lock fails here instead of being re-locked; the runtime slots
      # install exactly the lock (uv sync --frozen). Python comes from app/.python-version.
      - name: Python dependencies
        run: uv sync --locked --extra test
      - name: pytest
        run: uv run --no-sync python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: node tests
        shell: bash
        run: node --test web/js/components/*.test.mjs web/js/views/*.test.mjs web/js/*.test.mjs web/tablet/*.test.mjs

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            desktop:
              - 'app/desktop/**'
              - '.github/workflows/ci.yml'

  desktop:
    name: desktop (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: app/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Tauri prerequisites (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/desktop/src-tauri
      - name: cargo test
        run: cargo test
      - name: cargo build
        run: cargo build
