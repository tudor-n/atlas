[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainhub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.12"]

[project.optional-dependencies]
test = ["pytest", "pytest-aiohttp"]

[tool.setuptools]
packages = ["brainhub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
