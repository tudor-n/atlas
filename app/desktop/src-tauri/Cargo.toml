[package]
name = "brainhub-desktop"
version = "0.1.0"
description = "BrainHub desktop widget, tray and hub supervisor"
edition = "2021"

[lib]
name = "brainhub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# The version tauri 2 uses (`cargo tree -i gtk`), for the widget's window type hint (ruling D1).
gtk = "0.18"
