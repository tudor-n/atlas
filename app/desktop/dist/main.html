<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrainHub</title>
<style>
  /* The main window's first page, until the hub answers (phase 4.5). No script: the shell
     navigates the window to the hub. System fonts only (Roboto lives with the hub). */
  html, body { height: 100%; margin: 0; background: #000; color: #fff; }
  body { overflow: hidden; }
  .bar {
    box-sizing: border-box; height: 56px; display: flex; align-items: center; gap: 24px;
    padding: 0 20px; border-bottom: 1px solid #262626; user-select: none;
  }
  .mono { font-family: ui-monospace, "DejaVu Sans Mono", "Cascadia Mono", Consolas, monospace; }
  .brand { font-size: 13px; font-weight: 600; letter-spacing: .14em; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #8a8a8a; letter-spacing: .06em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ffb020; }
</style>
</head>
<body>
<div class="bar">
  <span class="brand mono">BRAINHUB</span>
  <span class="status mono"><span class="dot"></span>STARTING THE HUB…</span>
</div>
</body>
</html>
